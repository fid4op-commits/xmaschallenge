<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>No Sugar 'Til Xmas - Carlos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- SDK do Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg: #0b132b;
      --card: #1c2541;
      --card-border: #3a506b;
      --green: #10b981;
      --blue: #3b82f6;
      --yellow: #f59e0b;
      --red: #ef4444;
      --white: #ffffff;
      --muted: #9ca3af;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--bg);
      color: var(--white);
      margin: 0;
      padding: 12px;
      background-image: radial-gradient(rgba(59, 130, 246, 0.1) 1px, transparent 0);
      background-size: 20px 20px;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      max-width: 400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--card);
      border: 2px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .main-title {
      font-family: 'Press Start 2P', monospace;
      text-align: center;
      font-size: 0.75rem;
      color: var(--green);
      text-shadow: 2px 2px var(--blue);
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .subtitle {
      text-align: center;
      font-size: 0.8rem;
      color: var(--yellow);
      font-weight: 700;
      margin-bottom: 12px;
    }

    .section-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.6rem;
      color: var(--blue);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    /* Score Display */
    .score-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      margin-bottom: 12px;
    }

    .score-value {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.85rem;
      color: var(--yellow);
    }

    /* Checkbox & Inputs */
    .action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .btn-action {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.65rem;
      background: var(--green);
      color: var(--white);
      border: none;
      padding: 14px;
      border-radius: 8px;
      width: 100%;
      cursor: pointer;
      margin-top: 10px;
      font-weight: bold;
      text-shadow: 1px 1px #000;
      box-shadow: 0 4px 0px #059669;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .btn-action:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0px #059669;
    }

    .joker-tag {
      font-size: 0.75rem;
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid var(--blue);
      border-radius: 4px;
      padding: 4px 8px;
      margin-top: 4px;
      display: inline-block;
    }
  </style>
</head>
<body>

<div class="container">

  <div class="card">
    <div class="main-title">🎄 NO SUGAR 'TIL XMAS 🎄</div>
    <div class="subtitle">DESAFIO DO CARLOS</div>

    <div class="score-box">
      <span>MULTIPLIER:</span>
      <span class="score-value" id="mult-display">1x</span>
    </div>

    <div class="section-title">Ações do Dia</div>
    
    <div class="action-row">
      <label>
        <input type="checkbox" id="chk-sweet-saver"> 🃏 Sweet Saver Active (+1 Mult)
      </label>
    </div>

    <div class="action-row">
      <label>
        <input type="checkbox" id="chk-sugar-free"> 🃏 Sugar Free Day (+1 Mult)
      </label>
    </div>

    <button class="btn-action" id="btn-calc">CALCULAR MULTIPLICADOR</button>
  </div>

  <div class="card">
    <div class="section-title">Jokers Ativos</div>
    <div id="active-jokers-list">
      <div class="joker-tag">🍰 Sweet Saver</div>
      <div class="joker-tag">🚫 Sugar Free</div>
    </div>
  </div>

</div>

<script>
  // ATENÇÃO: Substitui pelas tuas credenciais do projeto Firebase do CARLOS
  const firebaseConfig = {
    apiKey: "SUA_API_KEY_CARLOS",
    authDomain: "seu-projeto-carlos.firebaseapp.com",
    projectId: "seu-projeto-carlos",
    storageBucket: "seu-projeto-carlos.appspot.com",
    messagingSenderId: "123456789",
    appId: "1:123456789:web:abcdef"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const chkSweetSaver = document.getElementById('chk-sweet-saver');
  const chkSugarFree = document.getElementById('chk-sugar-free');
  const multDisplay = document.getElementById('mult-display');
  const btnCalc = document.getElementById('btn-calc');

  // CORREÇÃO DO BUG: Cálculo acumulativo dos multiplicadores
  function calculateMultiplier() {
    let mult = 1; // Multiplicador Base

    // Verifica cada condição de forma independente com 'if' (e não 'else if')
    if (chkSweetSaver.checked) {
      mult += 1; // Soma +1 de multiplicador do Sweet Saver
    }

    if (chkSugarFree.checked) {
      mult += 1; // Soma +1 de multiplicador do Sugar Free
    }

    // Atualiza a interface
    multDisplay.innerText = mult + 'x';
    saveData(mult);
  }

  function saveData(currentMult) {
    db.collection("users").doc("carlos").set({
      currentMultiplier: currentMult,
      sweetSaverActive: chkSweetSaver.checked,
      sugarFreeActive: chkSugarFree.checked,
      lastUpdated: new Date()
    }, { merge: true });
  }

  btnCalc.onclick = calculateMultiplier;
</script>

</body>
</html>
