<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>No Sugar 'Til Xmas - Carlos Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDKs (Compat Version) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-dark: #0b101d;
      --card-bg: #151d30;
      --card-border: #2a3a5e;
      --balatro-blue: #0088ff;
      --balatro-red: #ff334b;
      --balatro-yellow: #ffcc00;
      --balatro-green: #00e676;
      --text-main: #ffffff;
      --text-muted: #8a99ad;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      padding: 12px;
      background-image: radial-gradient(rgba(0, 136, 255, 0.15) 1px, transparent 0);
      background-size: 16px 16px;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .header-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.8rem;
      color: var(--balatro-blue);
      text-align: center;
      text-shadow: 2px 2px #000;
      line-height: 1.4;
      margin-bottom: 4px;
    }

    .header-sub {
      text-align: center;
      font-size: 0.85rem;
      color: var(--balatro-yellow);
      font-weight: 700;
      margin-bottom: 10px;
    }

    /* Score Panel */
    .score-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: #080c17;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      text-align: center;
      margin-bottom: 10px;
    }

    .score-box {
      display: flex;
      flex-direction: column;
    }

    .score-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.55rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .score-val-chips {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.9rem;
      color: var(--balatro-blue);
    }

    .score-val-mult {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.9rem;
      color: var(--balatro-red);
    }

    .section-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.65rem;
      color: var(--balatro-yellow);
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    /* Option Rows */
    .option-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .option-label {
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-main {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.7rem;
      background: var(--balatro-blue);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      width: 100%;
      cursor: pointer;
      margin-top: 6px;
      text-shadow: 1px 1px #000;
      box-shadow: 0 4px 0 #005bb5;
      transition: all 0.1s;
    }

    .btn-main:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #005bb5;
    }

    .joker-card {
      background: rgba(0, 136, 255, 0.08);
      border: 1px dashed var(--balatro-blue);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.8rem;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .joker-title {
      font-weight: bold;
      color: var(--balatro-yellow);
    }

    .joker-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div class="container">

  <!-- HEADER & DASHBOARD -->
  <div class="card">
    <div class="header-title">🃏 NO SUGAR 'TIL XMAS 🃏</div>
    <div class="header-sub">CARLOS' BALATRO QUEST</div>

    <div class="score-panel">
      <div class="score-box">
        <span class="score-label">CHIPS</span>
        <span class="score-val-chips" id="display-chips">0</span>
      </div>
      <div class="score-box">
        <span class="score-label">MULT</span>
        <span class="score-val-mult" id="display-mult">1x</span>
      </div>
    </div>

    <div class="section-title">DAILY LOG</div>

    <div class="option-row">
      <span class="option-label">🏋️ Workout Logged</span>
      <input type="checkbox" id="chk-workout" style="width: 18px; height: 18px;">
    </div>

    <div class="option-row">
      <span class="option-label">🚫 Sugar Free Clean</span>
      <input type="checkbox" id="chk-sugarfree" style="width: 18px; height: 18px;">
    </div>

    <button class="btn-main" id="btn-submit-day">SUBMIT DAY LOG</button>
  </div>

  <!-- PERKS / JOKERS SECTION -->
  <div class="card">
    <div class="section-title">ACTIVE JOKERS</div>
    
    <div class="joker-card">
      <div>
        <div class="joker-title">🍰 Sweet Saver</div>
        <div class="joker-desc">Proteção contra falhas no plano de açúcar</div>
      </div>
      <span style="color: var(--balatro-green); font-weight: bold;">PASSIVO</span>
    </div>
  </div>

  <!-- SKIPS AND CAMPAIGN TRACKER -->
  <div class="card">
    <div class="section-title">CAMPAIGN STATUS</div>
    <div style="display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: bold; margin-bottom: 6px;">
      <span>🏋️ Workout Skips: <b id="val-w-skips" style="color: var(--balatro-yellow);">5</b></span>
      <span>🍬 Sugar Skips: <b id="val-s-skips" style="color: var(--balatro-yellow);">0</b></span>
    </div>
    <div style="font-size: 0.8rem; color: var(--text-muted); text-align: center;">
      Ante Progress: <span id="val-ante" style="color: var(--balatro-blue); font-weight: bold;">Ante 1 / 16</span>
    </div>
  </div>

</div>

<script>
  // CONFIGURAÇÃO DO FIREBASE DO CARLOS
  const firebaseConfig = {
    apiKey: "AIzaSyDnQt7lYOaS2V2C-87jpj5jyPnZ4Cj7110",
    authDomain: "ana-gym-quest.firebaseapp.com",
    projectId: "ana-gym-quest",
    storageBucket: "ana-gym-quest.firebasestorage.app",
    messagingSenderId: "477732232018",
    appId: "1:477732232018:web:ba4a41b43321a7a54c788b"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let chips = 0;
  let mult = 1;
  let workoutSkips = 5;
  let sugarSkips = 0;
  let currentAnte = 1;

  const chkWorkout = document.getElementById('chk-workout');
  const chkSugarFree = document.getElementById('chk-sugarfree');
  const displayChips = document.getElementById('display-chips');
  const displayMult = document.getElementById('display-mult');
  const btnSubmit = document.getElementById('btn-submit-day');

  // CARREGAR DADOS DO CARLOS
  db.collection("users").doc("carlos").get().then((doc) => {
    if (doc.exists) {
      const data = doc.data();
      chips = data.chips || 0;
      mult = data.mult || 1;
      workoutSkips = data.workoutSkips ?? 5;
      sugarSkips = data.sugarSkips ?? 0;
      currentAnte = data.currentAnte || 1;
      updateDisplay();
    }
  }).catch(err => console.log("Load error:", err));

  btnSubmit.onclick = () => {
    if (chkSugarFree.checked) {
      mult += 1;
    } else {
      mult = 1; 
    }

    if (chkWorkout.checked) {
      chips += 100;
    }

    updateDisplay();
    saveData();
  };

  function updateDisplay() {
    displayChips.innerText = chips;
    displayMult.innerText = mult + "x";
    document.getElementById('val-w-skips').innerText = workoutSkips;
    document.getElementById('val-s-skips').innerText = sugarSkips;
    document.getElementById('val-ante').innerText = "Ante " + currentAnte + " / 16";
  }

  function saveData() {
    db.collection("users").doc("carlos").set({
      chips: chips,
      mult: mult,
      workoutSkips: workoutSkips,
      sugarSkips: sugarSkips,
      currentAnte: currentAnte,
      lastUpdated: new Date()
    }, { merge: true });
  }
</script>

</body>
</html>
