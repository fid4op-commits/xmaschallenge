<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Sugar 'Til Xmas</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #fff;
            font-family: monospace, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
        }
        .spectral-card-container {
            background: #111625;
            border: 2px solid #9c27b0;
            border-radius: 12px;
            padding: 16px;
            margin: 20px 0;
            color: #fff;
            box-shadow: 0 0 15px rgba(156, 39, 176, 0.3);
        }
        .spectral-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .spectral-title {
            color: #e040fb;
            font-weight: bold;
            font-size: 14px;
        }
        .spectral-timer {
            font-size: 12px;
            background: #221a36;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #7b1fa2;
            color: #ba68c8;
        }
        .spectral-question {
            font-size: 13px;
            margin-bottom: 12px;
            color: #cfd8dc;
        }
        .spectral-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .spectral-btn {
            background: #1e2538;
            border: 1px solid #3f51b5;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            font-size: 12px;
            font-family: monospace;
            transition: background 0.2s;
        }
        .spectral-btn:hover {
            background: #28324f;
            border-color: #5c6bc0;
        }
        .spectral-feedback {
            display: none;
            margin-top: 10px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- APP HEADER -->
    <div style="text-align: center; margin-bottom: 20px;">
        <h2 style="color: #4caf50; margin: 0; font-size: 18px;">🌲 NO SUGAR 'TIL XMAS 🌲</h2>
        <span style="font-size: 11px; color: #81c784;">☁️ CLOUD SYNCED</span>
    </div>

    <!-- 🔮 DAILY MYSTERY SPECTRAL CARD (EXPERT TRIVIA + 24H COOLDOWN) -->
    <div class="spectral-card-container">
        <div class="spectral-header">
            <span id="spectral-card-name" class="spectral-title">🔮 DAILY SPECTRAL</span>
            <span id="spectral-timer" class="spectral-timer">⏳ Loading...</span>
        </div>
        
        <div id="spectral-content">
            <p id="spectral-question" class="spectral-question">Loading question...</p>
            <div id="spectral-options" class="spectral-options">
                <!-- Dynamically populated via JS -->
            </div>
        </div>
        <div id="spectral-feedback" class="spectral-feedback"></div>
    </div>

    <!-- Rest of your application (Jokers, Stats, Antes, etc.) stays here safely -->

</div>

<script>
// Expert Questions Bank for Balatro Masters
const expertQuestionsBank = [
    {
        card: "Oops! All 6s",
        type: "Joker Expert",
        question: "If you have 'Oops! All 6s' equipped, what is the exact mathematical impact on the 'Wheel of Fortune' Tarot card and probability effects?",
        options: [
            "Doubles all listed probabilities on cards (e.g., 1 in 4 becomes 2 in 4).",
            "Guarantees a 100% success rate on any random effect in the deck.",
            "Adds a flat +6 value to all activation probabilities.",
            "Inverts probabilities, making failures count as successes."
        ],
        correct: 0
    },
    {
        card: "The Soul",
        type: "Spectral Expert",
        question: "Aside from rarely appearing in booster packs, what is the only other mandatory condition for 'The Soul' to possibly show up in a run?",
        options: [
            "You must have at least one open Joker slot available.",
            "You must already have at least one Legendary Joker unlocked in your profile.",
            "You must be playing in an Ante higher than Ante 8 (Endless Mode).",
            "Your current deck must contain at least 5 Polychrome cards."
        ],
        correct: 0
    },
    {
        card: "Blueprint vs Brainstorm",
        type: "Synergy Expert",
        question: "If you place a 'Blueprint' immediately to the left of a 'Brainstorm', and the 'Brainstorm' is copying a scoring Joker, what happens?",
        options: [
            "The Blueprint copies the Brainstorm, and both copy the original scoring Joker, tripling the effect.",
            "It creates an infinite loop of copies that immediately crashes the game.",
            "The Blueprint refuses to copy the Brainstorm due to copy restriction rules.",
            "The Brainstorm switches to copying the Blueprint, canceling out the bonus."
        ],
        correct: 0
    },
    {
        card: "Immolate",
        type: "Spectral",
        question: "What is the exact effect of the Spectral card Immolate?",
        options: [
            "Destroys 2 random Jokers and grants $20 instantly.",
            "Creates random copies of all cards currently held in hand.",
            "Converts all cards of the Clubs suit into Hearts.",
            "Removes all enhanced cards from your deck in exchange for Chips."
        ],
        correct: 0
    },
    {
        card: "Black Hole",
        type: "Spectral",
        question: "What is the super power of the Spectral card Black Hole?",
        options: [
            "Upgrades all poker hands simultaneously by 1 level.",
            "Absorbs all active Jokers to grant a temporary x10 multiplier bonus.",
            "Teleports the player directly to the next Ante without playing.",
            "Guarantees that the next Boss Blind is automatically defeated."
        ],
        correct: 0
    }
];

const COOLDOWN_HOURS = 24;
const COOLDOWN_MS = COOLDOWN_HOURS * 60 * 60 * 1000;

// Selects the question based on the current day of the year to rotate cyclically until Christmas
function getCurrentQuestion() {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const diff = (now - start) + ((start.getTimezoneOffset() - now.getTimezoneOffset()) * 60 * 1000);
    const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
    
    const index = dayOfYear % expertQuestionsBank.length;
    return expertQuestionsBank[index];
}

const currentQ = getCurrentQuestion();
let selectedCorrectIndex = currentQ.correct;

function initSpectralUI() {
    document.getElementById('spectral-card-name').innerText = '🔮 ' + currentQ.card.toUpperCase();
    document.getElementById('spectral-question').innerHTML = currentQ.question;
    
    const optionsContainer = document.getElementById('spectral-options');
    optionsContainer.innerHTML = '';
    
    currentQ.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'spectral-btn';
        btn.innerHTML = String.fromCharCode(65 + idx) + ') ' + opt;
        btn.onclick = () => checkSpectralAnswer(idx);
        optionsContainer.appendChild(btn);
    });
}

function updateSpectralState() {
    const lastAnswerTime = localStorage.getItem('balatro_last_spectral_time');
    const now = new Date().getTime();
    
    const optionsEl = document.getElementById('spectral-options');
    const questionEl = document.getElementById('spectral-question');
    const timerEl = document.getElementById('spectral-timer');
    const feedbackEl = document.getElementById('spectral-feedback');
    const cardTitleEl = document.getElementById('spectral-card-name');

    if (lastAnswerTime) {
        const elapsedTime = now - parseInt(lastAnswerTime, 10);
        const timeLeft = COOLDOWN_MS - elapsedTime;

        if (timeLeft > 0) {
            const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

            const timerFormatted = 
                String(hours).padStart(2, '0') + ':' + 
                String(minutes).padStart(2, '0') + ':' + 
                String(seconds).padStart(2, '0');

            if (timerEl) timerEl.innerText = '⏳ ' + timerFormatted;
            if (optionsEl) optionsEl.style.display = 'none';
            if (questionEl) questionEl.style.display = 'none';
            if (cardTitleEl) cardTitleEl.innerText = '🔮 DAILY SPECTRAL (COMPLETED)';
            if (feedbackEl) {
                feedbackEl.style.display = 'block';
                feedbackEl.style.color = '#ba68c8';
                feedbackEl.innerText = '✨ Daily challenge completed! Next card available soon.';
            }
            return;
        }
    }

    if (timerEl) timerEl.innerText = '🟢 Available!';
    if (optionsEl) optionsEl.style.display = 'flex';
    if (questionEl) questionEl.style.display = 'block';
    if (feedbackEl) feedbackEl.style.display = 'none';
    initSpectralUI();
}

function checkSpectralAnswer(optionIndex) {
    const feedbackEl = document.getElementById('spectral-feedback');
    const optionsEl = document.getElementById('spectral-options');
    const questionEl = document.getElementById('spectral-question');
    
    if (optionsEl) optionsEl.style.display = 'none';
    if (questionEl) questionEl.style.display = 'none';
    if (feedbackEl) feedbackEl.style.display = 'block';

    localStorage.setItem('balatro_last_spectral_time', new Date().getTime().toString());

    if (optionIndex === selectedCorrectIndex) {
        feedbackEl.style.color = '#00e676';
        feedbackEl.innerText = '✨ Correct answer, master! +5 Chips bonus added to your next log!';
    } else {
        feedbackEl.style.color = '#ff5252';
        feedbackEl.innerText = '❌ Wrong! You need to study the wiki more. Come back in 24h!';
    }
}

setInterval(updateSpectralState, 1000);
updateSpectralState();
</script>

</body>
</html>
